services:
  api:
    build:
      # the context is the project root, because the API image needs models/model.pkl
      context: ../..
      dockerfile: code/deployment/api/Dockerfile
    container_name: diabetes-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ../..
      dockerfile: code/deployment/app/Dockerfile
    container_name: diabetes-app
    environment:
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
